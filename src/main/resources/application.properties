spring.application.name=Cine_V2
spring.datasource.url=jdbc:postgresql://localhost:5432/cine_db
spring.datasource.username=cine_user
spring.datasource.password=cine_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 1. El secreto se inyecta desde una Variable de Entorno
# Nunca escribas la clave real aqui
jwt.secret=${JWT_SECRET:cine-v2-super-secreto-para-desarrollo-local-2024}

# 2. Tiempo de expiracion (1 hora)
jwt.expiration=3600000

# 3. Tiempo de expiracion del Refresh Token (7 dias)
jwt.refreshExpiration=604800000
